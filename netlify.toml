# Netlify deploy configuration for hmm.ventures
# Astro static site. Replaces the prior React + Vite config.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps=false"

# Research hub consolidation (Phase 1, 2026-05-16).
# Data products moved from top-level routes to /research/data/.
# Specific paths first; the splat covers scoreboard sub-routes (per-claim pages).
# /necessity-index/embed/ stays at its original URL (third-party iframe contract).
[[redirects]]
  from = "/necessity-index"
  to = "/research/data/necessity-index/"
  status = 301
  force = true

[[redirects]]
  from = "/necessity-index/methodology"
  to = "/research/data/necessity-index/methodology/"
  status = 301
  force = true

[[redirects]]
  from = "/calendar"
  to = "/research/data/calendar/"
  status = 301
  force = true

[[redirects]]
  from = "/scoreboard"
  to = "/research/data/scoreboard/"
  status = 301
  force = true

[[redirects]]
  from = "/scoreboard/*"
  to = "/research/data/scoreboard/:splat"
  status = 301
  force = true

# References consolidation (2026-05-17). Doctrine references absorbed
# into the site-wide /references/ route covering glossary + footnotes
# from doctrine + markets + research.
[[redirects]]
  from = "/doctrine/references"
  to = "/references/"
  status = 301
  force = true

[[redirects]]
  from = "/doctrine/references/*"
  to = "/references/:splat"
  status = 301
  force = true

# Fund-economics archive (2026-05-17). Returns framing and exit-multiple
# disclosures retired from the public surface; LP-tier content lives in
# the private IM. External links land on the IM-request page.
[[redirects]]
  from = "/research/four-tier-returns-framing"
  to = "/lps/"
  status = 301
  force = true

[[redirects]]
  from = "/research/four-tier-returns-framing/*"
  to = "/lps/"
  status = 301
  force = true

[[redirects]]
  from = "/research/exit-evidence-dataset"
  to = "/lps/"
  status = 301
  force = true

[[redirects]]
  from = "/research/exit-evidence-dataset/*"
  to = "/lps/"
  status = 301
  force = true

# Force SPA-style 404 for client-side routes that don't exist as files.
# Astro generates static .html per route, so 404s only hit for unknown URLs.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# Allow the /necessity-index/embed/ page to be iframed by third-party sites
[[headers]]
  for = "/necessity-index/embed/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "frame-ancestors *"

# Long-cache the Astro asset bundle
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
