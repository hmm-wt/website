functionsDirectory = "/private/tmp/hmm-landing-deploy/netlify/functions"
functionsDirectoryOrigin = "ui"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

[functions."*"]

[build]
publish = "/private/tmp/hmm-landing-deploy/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"
functions = "/private/tmp/hmm-landing-deploy/netlify/functions"

[build.environment]
NODE_VERSION = "20"
NPM_FLAGS = "--legacy-peer-deps=false"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "interest-cohort=()"

[[headers]]
for = "/necessity-index/embed/*"

[headers.values]
X-Frame-Options = "ALLOWALL"
Content-Security-Policy = "frame-ancestors *"

[[headers]]
for = "/_astro/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/*"
to = "/404.html"
status = 404.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]